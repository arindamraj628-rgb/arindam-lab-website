  <style>
    /* Total Cycle Duration: 5s */
    /* 0% -> 35%: Action Outward (Melt down to puddle) */
    /* 35% -> 70%: Action Inward (Reform slowly back up) */
    /* 70% -> 100%: Shared Static Hold */

    .letterR {
      transform-origin: 110px 280px;
      animation: stretchR 5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
    }

    .rShape {
      animation: rMorph 5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
    }

    .aShape {
      animation: aMelt 5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
    }

    @keyframes stretchR {
      0%   { transform: scale(1, 1); }
      18%  { transform: scale(0.9, 1.15); }
      35%  { transform: scale(1.38, 0.78); }
      52%  { transform: scale(0.95, 1.05); }
      70%  { transform: scale(1, 1); }
      100% { transform: scale(1, 1); }
    }

    @keyframes rMorph {
      0%   { d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z"); }
      18%  { d: path("M45 20 L115 20 C165 20 185 40 185 90 C185 135 160 155 118 160 L185 310 L145 310 L98 180 L90 180 L90 310 L45 310 Z M90 55 L112 55 C135 55 148 65 148 86 C148 108 135 118 112 118 L90 118 Z"); }
      35%  { d: path("M30 85 L135 85 C195 85 215 100 215 135 C215 170 180 185 132 192 L210 300 L160 300 L104 210 L80 210 L80 300 L30 300 Z M80 115 L125 115 C150 115 162 122 162 135 C162 150 150 160 L80 160 Z"); }
      52%  { d: path("M48 35 L115 35 C165 35 185 55 185 100 C185 145 160 165 118 170 L185 300 L145 300 L98 188 L90 188 L90 300 L48 300 Z M90 70 L112 70 C135 70 148 80 148 101 C148 123 135 133 112 133 L90 133 Z"); }
      70%  { d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z"); }
      100% { d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z"); }
    }

    @keyframes aMelt {
      /* 0% - Fully Formed A */
      0% {
        d: path("M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z");
      }
      /* 8% - Instant Loss of Rigid Structure (Softening apex and bowing legs outward) */
      8% {
        d: path("M 82 70 C 95 55 125 55 138 70 L 185 300 L 136 300 C 126 250 120 220 122 200 C 100 200 96 220 88 300 L 35 300 Z M 110 110 C 102 145 102 165 102 175 L 118 175 C 118 165 118 145 110 110 Z");
      }
      /* 18% - Deep Sag & Organic Flow down to Mid-Height */
      18% {
        d: path("M 70 150 C 90 130 130 130 150 150 C 175 220 190 270 195 300 L 140 300 C 122 270 118 245 116 235 C 104 235 100 270 82 300 L 25 300 Z M 110 180 C 105 210 105 220 105 225 L 115 225 C 115 220 115 210 110 180 Z");
      }
      /* 28% - Collapsing Heavy Liquid Pool */
      28% {
        d: path("M 62 230 C 85 210 135 210 158 230 C 185 265 205 285 202 300 L 148 300 C 128 290 120 270 112 270 C 104 270 96 290 72 300 L 18 300 Z M 110 250 C 106 262 106 265 106 267 L 114 267 C 114 265 114 262 110 250 Z");
      }
      /* 35% - Peak Fluid Puddle */
      35% {
        d: path("M 60 270 C 85 258 135 258 160 270 C 195 282 210 292 205 300 L 150 300 C 130 300 122 290 110 290 C 98 290 90 300 70 300 L 15 300 C 10 292 25 282 60 270 Z M 110 288 C 108 288 106 292 106 294 C 106 296 114 296 114 294 C 114 292 112 288 110 288 Z");
      }
      /* 45% - Re-coiling Fluid Rise */
      45% {
        d: path("M 62 230 C 85 210 135 210 158 230 C 185 265 205 285 202 300 L 148 300 C 128 290 120 270 112 270 C 104 270 96 290 72 300 L 18 300 Z M 110 250 C 106 262 106 265 106 267 L 114 267 C 114 265 114 262 110 250 Z");
      }
      /* 55% - Pulling Back into Apex Frame */
      55% {
        d: path("M 70 150 C 90 130 130 130 150 150 C 175 220 190 270 195 300 L 140 300 C 122 270 118 245 116 235 C 104 235 100 270 82 300 L 25 300 Z M 110 180 C 105 210 105 220 105 225 L 115 225 C 115 220 115 210 110 180 Z");
      }
      /* 64% - Sharpening Curves to Geometry */
      64% {
        d: path("M 82 70 C 95 55 125 55 138 70 L 185 300 L 136 300 C 126 250 120 220 122 200 C 100 200 96 220 88 300 L 35 300 Z M 110 110 C 102 145 102 165 102 175 L 118 175 C 118 165 118 145 110 110 Z");
      }
      /* 70% - Fully Restored Solid A */
      70% {
        d: path("M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z");
      }
      /* 100% - Static Hold */
      100% {
        d: path("M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z");
      }
    }
  </style>
