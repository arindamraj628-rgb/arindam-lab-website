# site properties and page defaults
title: "RAJ LAB" 
subtitle: "Advanced Multiscale Design, Fabrication, and Characterization"
description: "We develop advanced characterization and fabrication techniques for complex materials."
header: images/background1.png
footer: images/background1.png
proofer: false

# site social media and other links
links:
  email: contact@arindamraj628-rgb.com
  orcid: 0000-0001-7277-6770
  google-scholar: 3Fk2GOoAAAAJ
  #github: arindamraj628-rgb
 # twitter: arindamraj628-rgb
  #youtube: arindamraj628-rgb

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
