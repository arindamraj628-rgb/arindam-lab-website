<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .plastic-cube {
      transform-origin: 100px 110px;
      animation: plasticDeformation 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes plasticDeformation {
      0%, 100% {
        /* Initial state: elastic loading phase */
        transform: scale(1, 1) skewX(0deg);
      }
      20% {
        /* Yield point reached */
        transform: scale(1.05, 0.95) skewX(5deg);
      }
      50% {
        /* Maximum plastic shear flow / elongation */
        transform: scale(1.15, 0.85) skewX(22deg);
      }
      75% {
        /* Necking/relaxation transition */
        transform: scale(1.08, 0.92) skewX(10deg);
      }
    }
  </style>

  <!-- Background glow for depth -->
  <circle cx="100" cy="100" r="60" fill="#0284c7" opacity="0.1" filter="blur(10px)" />

  <!-- Deforming Isometric Cube Group -->
  <g class="plastic-cube">
    <!-- Top Face -->
    <polygon points="100,55 145,78 100,101 55,78" fill="#7dd3fc" />
    
    <!-- Left Face -->
    <polygon points="55,78 100,101 100,155 55,132" fill="#38bdf8" />
    
    <!-- Right Face -->
    <polygon points="100,101 145,78 145,132 100,155" fill="#0284c7" />
  </g>
</svg>
