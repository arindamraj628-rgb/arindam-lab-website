<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340" width="100%" height="100%">
  <defs>

    <!-- Polycrystalline Microstructure -->
    <g id="microstructure" stroke="#020617" stroke-width="2" stroke-linejoin="round">
      <rect width="60" height="60" fill="#2563eb"/>
      <path d="M0,0 L20,10 L15,30 L0,20 Z" fill="#ef4444"/>
      <path d="M20,10 L45,5 L55,25 L35,40 L15,30 Z" fill="#10b981"/>
      <path d="M45,5 L60,0 L60,20 L55,25 Z" fill="#f59e0b"/>
      <path d="M0,20 L15,30 L10,50 L0,60 L0,40 Z" fill="#8b5cf6"/>
      <path d="M15,30 L35,40 L30,60 L10,50 Z" fill="#ec4899"/>
      <path d="M35,40 L55,25 L60,20 L60,45 L50,60 L30,60 Z" fill="#06b6d4"/>
      <path d="M60,45 L60,60 L50,60 Z" fill="#eab308"/>
    </g>

    <pattern id="grainPattern"
      width="60"
      height="60"
      patternUnits="userSpaceOnUse"
      patternTransform="scale(.85) rotate(15)">
      <use href="#microstructure"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6"
          flood-color="#3b82f6"
          flood-opacity=".25"/>
    </filter>

  </defs>

  <style>
    .letter{
      transform-origin:110px 170px;
      animation:stretch 5s cubic-bezier(.4,0,.2,1) infinite;
    }

    .rShape{
      animation:rMorph 5s cubic-bezier(.4,0,.2,1) infinite;
    }

    @keyframes stretch{

      0%,100%{
        transform:scale(1,1);
      }

      35%{
        transform:scale(.98,1.05);
      }

      70%{
        transform:scale(.95,1.10);
      }

      85%{
        transform:scale(.98,1.03);
      }

    }

    @keyframes rMorph{

      0%,100%{
        d:path("
M50 40
L115 40
C165 40 185 60 185 105
C185 150 160 170 118 175
L185 300
L145 300
L98 190
L90 190
L90 300
L50 300
Z

M90 75
L112 75
C135 75 148 85 148 106
C148 128 135 138 112 138
L90 138
Z");
      }

      35%{
        d:path("
M53 40
L112 40
C160 40 178 64 178 112
C178 160 150 180 106 188
L182 308
L148 308
L94 204
L84 204
L84 308
L53 308
Z

M84 80
L105 80
C126 80 138 90 138 112
C138 136 126 148 105 148
L84 148
Z");
      }

      70%,85%{
        d:path("
M58 40
L106 40
C150 40 165 68 165 118
C165 170 140 192 94 205
L180 320
L150 320
L92 225
L78 225
L78 320
L58 320
Z

M78 90
L95 90
C112 90 122 100 122 120
C122 142 112 154 95 154
L78 154
Z");
      }

    }
  </style>

  <g class="letter" filter="url(#glow)">

    <path
      class="rShape"
      fill="url(#grainPattern)"
      fill-rule="evenodd"
      stroke="#020617"
      stroke-width="3"
      stroke-linejoin="round"
      d="
M50 40
L115 40
C165 40 185 60 185 105
C185 150 160 170 118 175
L185 300
L145 300
L98 190
L90 190
L90 300
L50 300
Z

M90 75
L112 75
C135 75 148 85 148 106
C148 128 135 138 112 138
L90 138
Z"/>

  </g>

</svg>
