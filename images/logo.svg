<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="100%" height="100%">
  <defs>
    <!-- Shared Mosaic Pattern for Letter R -->
    <pattern id="mosaicPatternR" width="220" height="340" patternUnits="userSpaceOnUse">
      <g stroke="#020617" stroke-width="4" stroke-linejoin="round">
        <!-- Row 1 -->
        <polygon points="-5,-5 60,-5 55,45 -5,55" fill="#00bcd4"/>
        <polygon points="60,-5 110,-5 100,50 55,45" fill="#8b5cf6"/>
        <polygon points="110,-5 160,-5 150,55 100,50" fill="#f43f5e"/>
        <polygon points="160,-5 225,-5 225,65 150,55" fill="#10b981"/>
        <!-- Row 2 -->
        <polygon points="-5,55 55,45 60,115 -5,120" fill="#3b82f6"/>
        <polygon points="55,45 100,50 115,120 60,115" fill="#f59e0b"/>
        <polygon points="100,50 150,55 160,115 115,120" fill="#8b5cf6"/>
        <polygon points="150,55 225,65 225,125 160,115" fill="#f43f5e"/>
        <!-- Row 3 -->
        <polygon points="-5,120 60,115 55,185 -5,180" fill="#f43f5e"/>
        <polygon points="60,115 115,120 125,175 55,185" fill="#00bcd4"/>
        <polygon points="115,120 160,115 170,185 125,175" fill="#f59e0b"/>
        <polygon points="160,115 225,125 225,195 170,185" fill="#3b82f6"/>
        <!-- Row 4 -->
        <polygon points="-5,180 55,185 65,245 -5,240" fill="#10b981"/>
        <polygon points="55,185 125,175 140,235 65,245" fill="#f43f5e"/>
        <polygon points="125,175 170,185 190,250 140,235" fill="#00bcd4"/>
        <polygon points="170,185 225,195 225,255 190,250" fill="#8b5cf6"/>
        <!-- Row 5 -->
        <polygon points="-5,240 65,245 55,315 -5,310" fill="#8b5cf6"/>
        <polygon points="65,245 140,235 130,320 55,315" fill="#3b82f6"/>
        <polygon points="140,235 190,250 200,315 130,320" fill="#10b981"/>
        <polygon points="190,250 225,255 225,325 200,315" fill="#f43f5e"/>
        <!-- Row 6 -->
        <polygon points="-5,310 55,315 60,360 -5,360" fill="#00bcd4"/>
        <polygon points="55,315 130,320 120,360 60,360" fill="#f59e0b"/>
        <polygon points="130,320 200,315 210,360 120,360" fill="#8b5cf6"/>
        <polygon points="200,315 225,325 225,360 210,360" fill="#3b82f6"/>
      </g>
    </pattern>

    <!-- Shared Mosaic Pattern for Letter A -->
    <pattern id="mosaicPatternA" width="220" height="340" patternUnits="userSpaceOnUse">
      <g stroke="#020617" stroke-width="4" stroke-linejoin="round">
        <!-- Row 1 -->
        <polygon points="-5,-5 60,-5 55,45 -5,55" fill="#00bcd4"/>
        <polygon points="60,-5 110,-5 100,50 55,45" fill="#8b5cf6"/>
        <polygon points="110,-5 160,-5 150,55 100,50" fill="#f43f5e"/>
        <polygon points="160,-5 225,-5 225,65 150,55" fill="#10b981"/>
        <!-- Row 2 -->
        <polygon points="-5,55 55,45 60,115 -5,120" fill="#3b82f6"/>
        <polygon points="55,45 100,50 115,120 60,115" fill="#f59e0b"/>
        <polygon points="100,50 150,55 160,115 115,120" fill="#8b5cf6"/>
        <polygon points="150,55 225,65 225,125 160,115" fill="#f43f5e"/>
        <!-- Row 3 -->
        <polygon points="-5,120 60,115 55,185 -5,180" fill="#f43f5e"/>
        <polygon points="60,115 115,120 125,175 55,185" fill="#00bcd4"/>
        <polygon points="115,120 160,115 170,185 125,175" fill="#f59e0b"/>
        <polygon points="160,115 225,125 225,195 170,185" fill="#3b82f6"/>
        <!-- Row 4 -->
        <polygon points="-5,180 55,185 65,245 -5,240" fill="#10b981"/>
        <polygon points="55,185 125,175 140,235 65,245" fill="#f43f5e"/>
        <polygon points="125,175 170,185 190,250 140,235" fill="#00bcd4"/>
        <polygon points="170,185 225,195 225,255 190,250" fill="#8b5cf6"/>
        <!-- Row 5 -->
        <polygon points="-5,240 65,245 55,315 -5,310" fill="#8b5cf6"/>
        <polygon points="65,245 140,235 130,320 55,315" fill="#3b82f6"/>
        <polygon points="140,235 190,250 200,315 130,320" fill="#10b981"/>
        <polygon points="190,250 225,255 225,325 200,315" fill="#f43f5e"/>
        <!-- Row 6 -->
        <polygon points="-5,310 55,315 60,360 -5,360" fill="#00bcd4"/>
        <polygon points="55,315 130,320 120,360 60,360" fill="#f59e0b"/>
        <polygon points="130,320 200,315 210,360 120,360" fill="#8b5cf6"/>
        <polygon points="200,315 225,325 225,360 210,360" fill="#3b82f6"/>
      </g>
    </pattern>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity=".18"/>
    </filter>
  </defs>

  <style>
    .letterR {
      transform-origin: 110px 280px;
      animation: stretchR 5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
    }

    .rShape {
      animation: rMorph 5s cubic-bezier(0.45, 0, 0.15, 1) infinite;
    }

    @keyframes stretchR {
      0% {
        transform: scale(1, 1);
      }
      20% {
        transform: scale(0.88, 1.10);
      }
      40% {
        transform: scale(1, 1);
      }
      60% {
        transform: scale(1.22, 0.88);
      }
      80%, 100% {
        transform: scale(1, 1);
      }
    }

    @keyframes rMorph {
      0% {
        d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z");
      }
      20% {
        d: path("M58 20 L102 20 C142 20 158 55 158 94.2 C158 141 132 160.5 88 173.8 L172 300 L142 300 L88 207 L72 207 L72 300 L58 300 Z M72 63 L90 63 C108 63 118 72 118 89.6 C118 109 108 120.6 90 120.6 L72 120.6 Z");
      }
      40% {
        d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z");
      }
      60% {
        d: path("M37 70 L129 70 C186 70 206 90 206 128 C206 165 176 181 128 188 L201 300 L155 300 L101 204 L83 204 L83 300 L37 300 Z M83 105 L120 105 C145 105 158 115 158 128 C158 145 145 155 L83 155 Z");
      }
      80%, 100% {
        d: path("M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z");
      }
    }
  </style>

  <!-- LETTER 1: R -->
  <g transform="translate(30, 20)">
    <g class="letterR" filter="url(#glow)">
      <path class="rShape" fill="url(#mosaicPatternR)" fill-rule="evenodd" stroke="#020617" stroke-width="5" stroke-linejoin="round" d="M50 40 L115 40 C165 40 185 60 185 105 C185 150 160 170 118 175 L185 300 L145 300 L98 190 L90 190 L90 300 L50 300 Z M90 75 L112 75 C135 75 148 85 148 106 C148 128 135 138 112 138 L90 138 Z"/>
    </g>
  </g>

  <!-- LETTER 2: A -->
  <g transform="translate(260, 20)">
    <g filter="url(#glow)">
      <path fill="url(#mosaicPatternA)" fill-rule="evenodd" stroke="#020617" stroke-width="5" stroke-linejoin="round" d="M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z">
        <animate attributeName="d" dur="5s" repeatCount="indefinite" keyTimes="0; 0.22; 0.45; 0.68; 0.85; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z;
            M 70 210 C 90 190 130 190 150 210 C 190 240 205 270 200 300 L 145 300 L 125 255 L 95 255 L 75 300 L 20 300 C 15 270 30 240 70 210 Z M 110 230 C 104 230 102 248 102 252 C 102 258 118 258 118 252 C 118 248 116 230 110 230 Z;
            M 60 270 C 85 258 135 258 160 270 C 195 282 210 292 205 300 L 150 300 C 130 300 122 290 110 290 C 98 290 90 300 70 300 L 15 300 C 10 292 25 282 60 270 Z M 110 288 C 108 288 106 292 106 294 C 106 296 114 296 114 294 C 114 292 112 288 110 288 Z;
            M 70 210 C 90 190 130 190 150 210 C 190 240 205 270 200 300 L 145 300 L 125 255 L 95 255 L 75 300 L 20 300 C 15 270 30 240 70 210 Z M 110 230 C 104 230 102 248 102 252 C 102 258 118 258 118 252 C 118 248 116 230 110 230 Z;
            M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z;
            M 90 40 L 130 40 L 180 300 L 138 300 L 124 210 L 96 210 L 82 300 L 40 300 Z M 110 95 L 100 165 L 120 165 Z" />
      </path>
    </g>
  </g>

  <!-- LETTER 3: J -->
  <g transform="translate(490, 20)">
    <g filter="url(#glow)" stroke="#020617" stroke-width="4" stroke-linejoin="round">
      <!-- Polygon 1: Top Left Crossbar -->
      <polygon fill="#00bcd4">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            60,40 120,40 120,80 60,80;
            25,20 85,15 95,55 35,60;
            60,40 120,40 120,80 60,80;
            25,20 85,15 95,55 35,60;
            60,40 120,40 120,80 60,80;
            60,40 120,40 120,80 60,80" />
      </polygon>

      <!-- Polygon 2: Top Right Cap -->
      <polygon fill="#8b5cf6">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            120,40 180,40 180,80 120,80;
            165,20 210,30 195,75 150,65;
            120,40 180,40 180,80 120,80;
            165,20 210,30 195,75 150,65;
            120,40 180,40 180,80 120,80;
            120,40 180,40 180,80 120,80" />
      </polygon>

      <!-- Polygon 3: Upper Vertical Stem -->
      <polygon fill="#f43f5e">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            130,80 180,80 180,150 130,150;
            170,100 210,120 195,190 155,170;
            130,80 180,80 180,150 130,150;
            170,100 210,120 195,190 155,170;
            130,80 180,80 180,150 130,150;
            130,80 180,80 180,150 130,150" />
      </polygon>

      <!-- Polygon 4: Lower Vertical Stem -->
      <polygon fill="#3b82f6">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            130,150 180,150 180,215 130,215;
            145,190 190,205 175,275 130,260;
            130,150 180,150 180,215 130,215;
            145,190 190,205 175,275 130,260;
            130,150 180,150 180,215 130,215;
            130,150 180,150 180,215 130,215" />
      </polygon>

      <!-- Polygon 5: Outer Bottom Curve -->
      <polygon fill="#10b981">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            130,215 180,215 160,295 105,300;
            135,265 180,275 150,340 105,335;
            130,215 180,215 160,295 105,300;
            135,265 180,275 150,340 105,335;
            130,215 180,215 160,295 105,300;
            130,215 180,215 160,295 105,300" />
      </polygon>

      <!-- Polygon 6: Upward Left Hook Tip -->
      <polygon fill="#f59e0b">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            35,175 80,185 80,235 35,215;
            20,220 60,235 55,290 15,270;
            35,175 80,185 80,235 35,215;
            20,220 60,235 55,290 15,270;
            35,175 80,185 80,235 35,215;
            35,175 80,185 80,235 35,215" />
      </polygon>

      <!-- Polygon 7: Inner Hook Bottom Curve -->
      <polygon fill="#8b5cf6">
        <animate attributeName="points" dur="5s" repeatCount="indefinite" keyTimes="0; 0.20; 0.40; 0.60; 0.80; 1.0" keySplines="0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1; 0.45 0 0.15 1" calcMode="spline" values="
            35,215 80,235 130,215 105,300;
            25,270 65,285 135,255 105,340;
            35,215 80,235 130,215 105,300;
            25,270 65,285 135,255 105,340;
            35,215 80,235 130,215 105,300;
            35,215 80,235 130,215 105,300" />
      </polygon>
    </g>
  </g>
</svg>
