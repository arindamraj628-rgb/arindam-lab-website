<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 340" width="100%" height="100%">
  <defs>

    <!-- Mosaic Pattern matching the provided image -->
    <pattern id="mosaicPattern"
      width="220"
      height="340"
      patternUnits="userSpaceOnUse">
      
      <g stroke="#020617" stroke-width="4" stroke-linejoin="round">
        <!-- Row 1 -->
        <polygon points="-5,-5 60,-5 55,45 -5,55" fill="#00bcd4"/>
        <polygon points="60,-5 110,-5 100,50 55,45" fill="#8b5cf6"/>
        <polygon points="110,-5 160,-5 150,55 100,50" fill="#f43f5e"/>
        <polygon points="160,-5 225,-5 225,65 150,55" fill="#10b981"/>

        <!-- Row 2 -->
        <polygon points="-5,55 55,45 60,115 -5,120" fill="#3b82f6"/>
        <polygon points="55,45 100,50 115,120 60,115" fill="#f59e0b"/>
        <polygon points="100,50 150,55 160,115 115,120" fill="#8b5cf6"/>
        <polygon points="150,55 225,65 225,125 160,115" fill="#3b82f6"/>

        <!-- Row 3 -->
        <polygon points="-5,120 60,115 55,185 -5,180" fill="#f43f5e"/>
        <polygon points="60,115 115,120 125,175 55,185" fill="#00bcd4"/>
        <polygon points="115,120 160,115 170,185 125,175" fill="#f59e0b"/>
        <polygon points="160,115 225,125 225,195 170,185" fill="#3b82f6"/>

        <!-- Row 4 -->
        <polygon points="-5,180 55,185 65,245 -5,240" fill="#10b981"/>
        <polygon points="55,185 125,175 140,235 65,245" fill="#f43f5e"/>
        <polygon points="125,175 170,185 190,250 140,235" fill="#00bcd4"/>
        <polygon points="170,185 225,195 225,255 190,250" fill="#8b5cf6"/>

        <!-- Row 5 -->
        <polygon points="-5,240 65,245 55,315 -5,310" fill="#8b5cf6"/>
        <polygon points="65,245 140,235 130,320 55,315" fill="#3b82f6"/>
        <polygon points="140,235 190,250 200,315 130,320" fill="#10b981"/>
        <polygon points="190,250 225,255 225,325 200,315" fill="#f43f5e"/>

        <!-- Row 6 -->
        <polygon points="-5,310 55,315 60,360 -5,360" fill="#00bcd4"/>
        <polygon points="55,315 130,320 120,360 60,360" fill="#f59e0b"/>
        <polygon points="130,320 200,315 210,360 120,360" fill="#8b5cf6"/>
        <polygon points="200,315 225,325 225,360 210,360" fill="#3b82f6"/>
      </g>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6"
          flood-color="#000000"
          flood-opacity=".15"/>
    </filter>

  </defs>

  <style>
    .letter{
      transform-origin:110px 170px;
      animation:stretch 4s cubic-bezier(.4,0,.2,1) infinite;
    }

    .rShape{
      animation:rMorph 4s cubic-bezier(.4,0,.2,1) infinite;
    }

    /* Exaggerated vertical stretch and horizontal squash */
    @keyframes stretch{
      0%, 100% {
        transform: scale(1, 1);
      }
      25% {
        transform: scale(1.15, 0.82); /* Flatten down before spring up */
      }
      60% {
        transform: scale(0.78, 1.30); /* Exaggerated vertical stretch */
      }
      80% {
        transform: scale(1.05, 0.95); /* Rebound bounce */
      }
    }

    /* Exaggerated path morphing */
    @keyframes rMorph{
      0%, 100%{
        d:path("
M50 40
L115 40
C165 40 185 60 185 105
C185 150 160 170 118 175
L185 300
L145 300
L98 190
L90 190
L90 300
L50 300
Z
M90 75
L112 75
C135 75 148 85 148 106
C148 128 135 138 112 138
L90 138
Z");
      }
      25%{
        /* Compressed path when flattened */
        d:path("
M45 45
L120 45
C175 45 195 62 195 108
C195 155 168 172 122 178
L192 295
L148 295
L98 185
L88 185
L88 295
L45 295
Z
M88 80
L115 80
C140 80 152 88 152 108
C152 130 140 140 115 140
L88 140
Z");
      }
      60%{
        /* Extended path when stretched high */
        d:path("
M60 20
L100 20
C140 20 155 75 155 125
C155 178 130 200 85 215
L170 335
L140 335
L85 230
L70 230
L70 335
L60 335
Z
M70 95
L88 95
C105 95 115 105 115 125
C115 148 105 160 88 160
L70 160
Z");
      }
      80%{
        d:path("
M52 38
L113 38
C162 38 182 58 182 103
C182 148 158 168 116 173
L182 298
L143 298
L96 188
L88 188
L88 298
L52 298
Z
M88 73
L110 73
C133 73 145 83 145 104
C145 126 133 136 110 136
L88 136
Z");
      }
    }
  </style>

  <g class="letter" filter="url(#glow)">
    <path
      class="rShape"
      fill="url(#mosaicPattern)"
      fill-rule="evenodd"
      stroke="#020617"
      stroke-width="5"
      stroke-linejoin="round"
      d="
M50 40
L115 40
C165 40 185 60 185 105
C185 150 160 170 118 175
L185 300
L145 300
L98 190
L90 190
L90 300
L50 300
Z

M90 75
L112 75
C135 75 148 85 148 106
C148 128 135 138 112 138
L90 138
Z"/>
  </g>

</svg>
