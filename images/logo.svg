<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Polycrystalline Microstructure Base -->
    <g id="microstructure">
      <!-- Base metal color -->
      <rect width="60" height="60" fill="#9ca3af" />
      <!-- Individual grains -->
      <path d="M0,0 L20,10 L15,30 L0,20 Z" fill="#d1d5db" />
      <path d="M20,10 L45,5 L55,25 L35,40 L15,30 Z" fill="#f3f4f6" />
      <path d="M45,5 L60,0 L60,20 L55,25 Z" fill="#6b7280" />
      <path d="M0,20 L15,30 L10,50 L0,60 L0,40 Z" fill="#9ca3af" />
      <path d="M15,30 L35,40 L30,60 L10,50 Z" fill="#4b5563" />
      <path d="M35,40 L55,25 L60,20 L60,45 L50,60 L30,60 Z" fill="#d1d5db" />
      <path d="M60,45 L60,60 L50,60 Z" fill="#6b7280" />
      <!-- High-contrast grain boundaries -->
      <path d="M0,20 L15,30 L35,40 L55,25 L60,20 M20,10 L15,30 M45,5 L55,25 M15,30 L10,50 M35,40 L30,60 M55,25 L60,45 M50,60 L60,45" fill="none" stroke="#1f2937" stroke-width="1.5" />
    </g>

    <!-- Top Face Pattern: Light exposure -->
    <pattern id="top-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(15)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(255,255,255,0.2)"/>
    </pattern>

    <!-- Left Face Pattern: Mid exposure -->
    <pattern id="left-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(65)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Right Face Pattern: Shadowed exposure -->
    <pattern id="right-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(-25)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(0,0,0,0.4)"/>
    </pattern>
  </defs>

  <style>
    .plastic-cube {
      transform-origin: 100px 110px;
      /* 5-second loop mimicking elastic loading, plastic shear flow, and relaxation */
      animation: plasticDeformation 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes plasticDeformation {
      0%, 100% {
        transform: scale(1, 1) skewX(0deg);
      }
      20% {
        transform: scale(1.05, 0.95) skewX(5deg);
      }
      50% {
        transform: scale(1.15, 0.85) skewX(22deg);
      }
      75% {
        transform: scale(1.08, 0.92) skewX(10deg);
      }
    }
  </style>

  <!-- Soft background glow to maintain visual depth -->
  <circle cx="100" cy="100" r="60" fill="#9ca3af" opacity="0.1" filter="blur(10px)" />

  <!-- Animated Polycrystalline Cube Group -->
  <g class="plastic-cube">
    <!-- Top Face -->
    <polygon points="100,55 145,78 100,101 55,78" fill="url(#top-grains)" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Left Face -->
    <polygon points="55,78 100,101 100,155 55,132" fill="url(#left-grains)" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Right Face -->
    <polygon points="100,101 145,78 145,132 100,155" fill="url(#right-grains)" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
