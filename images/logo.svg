<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <!-- Custom pseudo-random polygonal grain pattern -->
        <pattern id="color-grains" width="100" height="100" patternUnits="userSpaceOnUse">
            <!-- Grain 1 (Blue) -->
            <polygon points="0,0 60,0 50,40 10,50 0,20" fill="#60a5fa" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
            <!-- Grain 2 (Red) -->
            <polygon points="60,0 100,0 100,30 70,60 50,40" fill="#f87171" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
            <!-- Grain 3 (Green) -->
            <polygon points="0,20 10,50 20,100 0,100" fill="#4ade80" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
            <!-- Grain 4 (Yellow) -->
            <polygon points="10,50 50,40 70,60 80,100 20,100" fill="#facc15" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
            <!-- Grain 5 (Purple) -->
            <polygon points="70,60 100,30 100,100 80,100" fill="#c084fc" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
        </pattern>
    </defs>

    <!-- Clean Background -->
    <rect width="500" height="500" fill="#f8fafc" rx="10" />

    <!-- Centered Origin for Symmetrical Stretching (Roughly X=250, Y=250) -->
    <g transform="translate(250, 250)">
        <g>
            <!-- Affine transformation mapping: elongates Y (tension) and contracts X (Poisson's ratio) -->
            <animateTransform attributeName="transform" type="scale" values="1 1; 0.75 1.45; 1 1" dur="4s" repeatCount="indefinite" />
            
            <!-- Letter R Sample -->
            <path fill-rule="evenodd" fill="url(#color-grains)" stroke="#0f172a" stroke-width="6" 
                  d="M 140 100 L 280 100 C 360 100, 360 250, 280 250 L 350 400 L 270 400 L 210 250 L 210 400 L 140 400 Z 
                     M 210 150 L 210 200 L 260 200 C 290 200, 290 150, 260 150 Z" 
                  transform="translate(-250, -250)" stroke-linejoin="round" />
        </g>
    </g>
</svg>
