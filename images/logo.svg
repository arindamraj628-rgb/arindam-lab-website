<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%">
  <defs>
    <!-- Polycrystalline Microstructure Base Pattern -->
    <g id="microstructure" stroke="#020617" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect width="60" height="60" fill="#2563eb" stroke="none" />
      
      <!-- Individual grains with orientation hues -->
      <path d="M0,0 L20,10 L15,30 L0,20 Z" fill="#ef4444" />
      <path d="M20,10 L45,5 L55,25 L35,40 L15,30 Z" fill="#10b981" />
      <path d="M45,5 L60,0 L60,20 L55,25 Z" fill="#f59e0b" />
      <path d="M0,20 L15,30 L10,50 L0,60 L0,40 Z" fill="#8b5cf6" />
      <path d="M15,30 L35,40 L30,60 L10,50 Z" fill="#ec4899" />
      <path d="M35,40 L55,25 L60,20 L60,45 L50,60 L30,60 Z" fill="#06b6d4" />
      <path d="M60,45 L60,60 L50,60 Z" fill="#eab308" />
    </g>

    <!-- Fill Pattern for the Specimen -->
    <pattern id="dogbone-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.85) rotate(15)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(255,255,255,0.08)"/>
    </pattern>

    <!-- Specimen Soft Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .dogbone-specimen {
      transform-origin: 160px 70px;
      animation: tensileFlow 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .dogbone-path {
      animation: neckingMorph 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Overall specimen stretching animation (kept comfortably in-bounds) */
    @keyframes tensileFlow {
      0%, 100% {
        transform: scale(1, 1);
      }
      30% {
        /* Uniform elastic/plastic extension */
        transform: scale(1.03, 0.98);
      }
      65% {
        /* Peak extension + necking */
        transform: scale(1.06, 0.95);
      }
      80% {
        /* Post-yield relaxation */
        transform: scale(1.02, 0.98);
      }
    }

    /* Morphing path to show uniform gauge initially, developing necking midway */
    @keyframes neckingMorph {
      0%, 100% {
        /* Initial state: Uniform gauge width (34px thick, parallel walls) */
        d: path("M 30,35 L 75,35 C 88,35 95,53 105,53 C 130,53 145,53 160,53 C 175,53 190,53 215,53 C 225,53 232,35 245,35 L 290,35 L 290,105 L 245,105 C 232,105 225,87 215,87 C 190,87 175,87 160,87 C 145,87 130,87 105,87 C 95,87 88,105 75,105 L 30,105 Z");
      }
      30% {
        /* Uniform elongation phase: Gauge thins uniformly to 30px, still parallel */
        d: path("M 30,35 L 75,35 C 88,35 95,55 105,55 C 130,55 145,55 160,55 C 175,55 190,55 215,55 C 225,55 232,35 245,35 L 290,35 L 290,105 L 245,105 C 232,105 225,85 215,85 C 190,85 175,85 160,85 C 145,85 130,85 105,85 C 95,85 88,105 75,105 L 30,105 Z");
      }
      65%, 80% {
        /* Plastic instability / Necking phase: Central region draws inward significantly (16px thick at center) */
        d: path("M 30,35 L 75,35 C 88,35 95,53 105,53 C 130,53 145,62 160,62 C 175,62 190,53 215,53 C 225,53 232,35 245,35 L 290,35 L 290,105 L 245,105 C 232,105 225,87 215,87 C 190,87 175,78 160,78 C 145,78 130,87 105,87 C 95,87 88,105 75,105 L 30,105 Z");
      }
    }
  </style>

  <!-- Polycrystalline Dogbone Specimen -->
  <g class="dogbone-specimen" filter="url(#glow)">
    <path class="dogbone-path"
      d="M 30,35 L 75,35 C 88,35 95,53 105,53 C 130,53 145,53 160,53 C 175,53 190,53 215,53 C 225,53 232,35 245,35 L 290,35 L 290,105 L 245,105 C 232,105 225,87 215,87 C 190,87 175,87 160,87 C 145,87 130,87 105,87 C 95,87 88,105 75,105 L 30,105 Z" 
      fill="url(#dogbone-grains)" 
      stroke="#020617" 
      stroke-width="2.5" 
      stroke-linejoin="round" />
  </g>
</svg>
