<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 40 150 130" width="100%" height="100%">
  <defs>
    <!-- Polycrystalline Microstructure Base with Equally Darkened Boundaries -->
    <g id="microstructure" stroke="#020617" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect width="60" height="60" fill="#2563eb" stroke="none" />
      
      <!-- Individual grains with uniform boundary strokes -->
      <path d="M0,0 L20,10 L15,30 L0,20 Z" fill="#ef4444" />
      <path d="M20,10 L45,5 L55,25 L35,40 L15,30 Z" fill="#10b981" />
      <path d="M45,5 L60,0 L60,20 L55,25 Z" fill="#f59e0b" />
      <path d="M0,20 L15,30 L10,50 L0,60 L0,40 Z" fill="#8b5cf6" />
      <path d="M15,30 L35,40 L30,60 L10,50 Z" fill="#ec4899" />
      <path d="M35,40 L55,25 L60,20 L60,45 L50,60 L30,60 Z" fill="#06b6d4" />
      <path d="M60,45 L60,60 L50,60 Z" fill="#eab308" />
    </g>

    <!-- Top Face Pattern: Light highlight overlay -->
    <pattern id="top-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(15)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(255,255,255,0.18)"/>
    </pattern>

    <!-- Left Face Pattern: Mild side shading overlay -->
    <pattern id="left-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(65)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(0,0,0,0.12)"/>
    </pattern>

    <!-- Right Face Pattern: Dark shadow overlay -->
    <pattern id="right-grains" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8) rotate(-25)">
      <use href="#microstructure"/>
      <rect width="60" height="60" fill="rgba(0,0,0,0.32)"/>
    </pattern>
  </defs>

  <style>
    .plastic-cube {
      transform-origin: 100px 110px;
      /* 5-second continuous plastic shear deformation cycle */
      animation: plasticDeformation 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes plasticDeformation {
      0%, 100% {
        transform: scale(1, 1) skewX(0deg);
      }
      20% {
        transform: scale(1.05, 0.95) skewX(5deg);
      }
      50% {
        transform: scale(1.15, 0.85) skewX(22deg);
      }
      75% {
        transform: scale(1.08, 0.92) skewX(10deg);
      }
    }
  </style>

  <!-- Ambient background glow -->
  <circle cx="100" cy="100" r="60" fill="#3b82f6" opacity="0.12" filter="blur(10px)" />

  <!-- Animated Polycrystalline Cube -->
  <g class="plastic-cube">
    <!-- Top Face -->
    <polygon points="100,55 145,78 100,101 55,78" fill="url(#top-grains)" stroke="#020617" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Left Face -->
    <polygon points="55,78 100,101 100,155 55,132" fill="url(#left-grains)" stroke="#020617" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Right Face -->
    <polygon points="100,101 145,78 145,132 100,155" fill="url(#right-grains)" stroke="#020617" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
